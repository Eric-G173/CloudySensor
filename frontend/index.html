<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudySensor</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class = "upper-container">
<header class="index-title">
  <h1>CloudySensor</h1>
</header>

<form class="city-form button-group" id="weather-form">
    <label for="city-input" class="sr-only">Enter a city</label>
    <input type="text" id="city-input" name="city" placeholder="Enter a City">
    <button type="submit" class="index-btn">Submit</button>
</form>

<div class="city-form button-group">
    <button class="index-btn" type="button">Use Current Location</button>
</div>

<p id="weather-error" style="color:red;"></p>
</div>
<div class="weather-card" id="weather-card" style="display:none;">
    <h1 class="weather-city" id="city-name"></h1>

    <div id="temp-scale-container" class="weather-temp">
        <div id="temp-Buttons">
            <button type="button" onclick="setScale('F')">F</button>
            <button type="button" onclick="setScale('C')">C</button>
        </div>
        <div id="temp-scale-display">
            <p id="temp">
                <span id="temp-number"></span>
                <span class="temp-scale"></span>
            </p>
        </div>
    </div>

    <div class="weather-highlow">
        <span id="high"></span>
        <span id="low"></span>
    </div>

    <div id="feels-like"></div>

    <p class="weather-condition" id="condition"></p>
</div>
<div id="status" hidden>Waking up the server… this can take up to a minute.</div>

<script>
  const API_BASE_URL = "https://weather-website-fjzu.onrender.com";

  // Wake the backend as soon as the page opens
  (async function wake() {
    const status = document.getElementById("status");
    const showTimer = setTimeout(() => { status.hidden = false; }, 1500);
    for (let i = 0; i < 8; i++) {
      try {
        const res = await fetch(`${API_BASE_URL}/health`);
        if (res.ok) { clearTimeout(showTimer); status.hidden = true; return; }
      } catch (e) {}
      await new Promise(r => setTimeout(r, 5000));
    }
    clearTimeout(showTimer);
    status.hidden = false;
    status.textContent = "Couldn't reach the server. Try refreshing.";
  })();
</script>
<script src="weather.js"></script>
</body>
</html>
