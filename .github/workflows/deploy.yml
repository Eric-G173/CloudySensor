name: Deploy to Render

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST \
            -H "Accept: application/json" \
            ${{ secrets.RENDER_DEPLOY_HOOK }}
